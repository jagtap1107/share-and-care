<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share & Care | Community Donation Portal</title>
<style>
:root{--g:#2e9e5b;--gd:#1f7a43;--gl:#e8f6ee;--o:#f59e0b;--t:#1f2937;--m:#6b7280;--w:#fff;--r:16px;--s:0 6px 20px rgba(0,0,0,.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:#f9fafb;line-height:1.6}
a{text-decoration:none;color:inherit}
.c{width:92%;max-width:1150px;margin:0 auto}
.ct{text-align:center}.mu{color:var(--m)}.sm{font-size:.9rem}
.btn{display:inline-block;padding:10px 24px;border-radius:50px;font-weight:600;border:2px solid var(--g);cursor:pointer;background:var(--g);color:#fff;font-size:1rem;font-family:inherit;transition:.2s}
.btn:hover{background:var(--gd);border-color:var(--gd)}
.btn.o{background:transparent;color:var(--g)}.btn.o:hover{background:var(--gl)}
.btn.l{background:#fff;color:var(--gd);border-color:#fff}
.btn.r{background:#dc2626;border-color:#dc2626}
.btn.s{padding:6px 16px;font-size:.88rem}
header{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);position:sticky;top:0;z-index:50}
.ni{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.logo{font-size:1.45rem;font-weight:800;color:var(--gd)}.logo b{color:var(--o)}
nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
nav a:not(.btn){font-weight:500}nav a:not(.btn):hover{color:var(--g)}
#tg{display:none;background:none;border:0;font-size:1.8rem;color:var(--gd);cursor:pointer}
.fl{margin-top:14px;padding:12px 18px;border-radius:12px;font-weight:500}
.fl.ok{background:#d1fae5;color:#065f46}.fl.err{background:#fee2e2;color:#991b1b}
.hero{background:linear-gradient(135deg,var(--gl),#fff7e6);padding:70px 0}
.hi{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.tag{display:inline-block;background:#fff;color:var(--gd);padding:6px 16px;border-radius:50px;font-size:.85rem;font-weight:600;box-shadow:var(--s)}
.hero h1{font-size:2.7rem;line-height:1.2;margin:16px 0;color:var(--gd)}
.hb{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.hv{position:relative;height:320px}
.blob{position:absolute;inset:16px;background:linear-gradient(135deg,var(--g),#6fcf97);border-radius:60% 40% 55% 45%/50% 55% 45% 50%}
.fc{position:absolute;background:#fff;padding:12px 20px;border-radius:var(--r);box-shadow:var(--s);font-weight:600;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.sec{padding:60px 0}.alt{background:#fff}
h2.st{text-align:center;font-size:1.9rem;color:var(--gd);margin-bottom:28px}
.gr{display:grid;gap:22px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g2{grid-template-columns:1fr 1fr}
.card{background:#fff;padding:24px;border-radius:var(--r);box-shadow:var(--s)}
.ic{font-size:2.4rem}
.no{width:46px;height:46px;margin:0 auto 10px;background:var(--g);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.cat{background:var(--gl);border-radius:var(--r);padding:20px 8px;text-align:center;font-size:2rem;cursor:pointer;display:flex;flex-direction:column}
.cat span{font-size:.9rem;font-weight:600;color:var(--gd)}.cat:hover{background:#c9ecd7}
.bd{display:inline-block;padding:3px 12px;border-radius:50px;font-size:.78rem;font-weight:700;background:#d1fae5;color:#065f46}
.bd.or{background:#fef3c7;color:#92400e}.bd.rd{background:#fee2e2;color:#991b1b}.bd.bl{background:#dbeafe;color:#1e40af}
.cta{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;padding:55px 0}
footer{background:#14301f;color:#d1d5db;padding:30px 0;text-align:center;font-size:.9rem}
.pg{padding:40px 0 60px}.pg h1{color:var(--gd);margin-bottom:6px}
.fm{max-width:560px;margin:0 auto}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
input,select,textarea{width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.fb input,.fb select{flex:1;min-width:140px}
.dc img,.dc .ph{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:3rem}
.dc h3{margin:6px 0 2px}
.st4 .card{text-align:center}.st4 .n{font-size:2rem;font-weight:800;color:var(--g)}
.tl{display:flex;margin:12px 0 6px}
.tl div{flex:1;text-align:center;font-size:.7rem;position:relative;color:var(--m)}
.tl div:before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#d1d5db;margin:0 auto 4px;position:relative;z-index:1}
.tl div:after{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:#d1d5db}
.tl div:first-child:after{display:none}
.tl .dn{color:var(--gd);font-weight:700}.tl .dn:before,.tl .dn:after{background:var(--g)}
.box{border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:14px;background:#fff}
.box .ac{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:.88rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eee}th{background:var(--gl);color:var(--gd)}
.ov{overflow-x:auto;margin-bottom:24px}
h3.sh{margin:28px 0 12px;color:var(--gd)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
#modal.on{display:flex}#modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto}
@media(max-width:900px){.hi{grid-template-columns:1fr;text-align:center}.hb{justify-content:center}.g3,.g4{grid-template-columns:1fr 1fr}.g6{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:2.1rem}}
@media(max-width:700px){#tg{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;padding:18px;box-shadow:0 10px 20px rgba(0,0,0,.08)}nav.on{display:flex}.g3,.g4,.g2,.row{grid-template-columns:1fr}.g6{grid-template-columns:1fr 1fr}.hv{height:240px}}
</style>
</head>
<body>
<header><div class="c ni"><a href="#/" class="logo">🤝 Share <b>&amp;</b> Care</a><button id="tg" onclick="document.getElementById('nav').classList.toggle('on')">☰</button><nav id="nav"></nav></div></header>
<div class="c" id="flash"></div>
<main id="app"></main>
<footer><div class="c">🤝 Share &amp; Care | Connecting donors, NGOs and people in need<br>© 2026 SE Computer Engineering CEP</div></footer>
<div id="modal"></div>

<script>
/* ================= DATABASE (localStorage) ================= */
const KEY = 'shareandcare_db';
let db = JSON.parse(localStorage.getItem(KEY) || 'null');
const save = () => localStorage.setItem(KEY, JSON.stringify(db));
const nid = a => a.length ? Math.max(...a.map(x => x.id)) + 1 : 1;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const expired = d => d.until && d.until < today();
const CATS = {Clothes:'👕',Books:'📚',Food:'🍲',Stationery:'✏️','Household Items':'🏠',Other:'🎁'};
const STEPS = ['Available','Requested','Accepted','Collected','Delivered'];

/* Password hashing (SHA-256 with email as salt) */
async function hash(p, salt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + p));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function initDb() {
  if (!db) {
    db = {users: [], donations: [], requests: [], needs: [], msgs: []};
    db.users.push({id: 1, name: 'Site Admin', email: 'admin@shareandcare.com', mobile: '9999999999',
      pw: await hash('admin123', 'admin@shareandcare.com'), address: 'Admin Office', city: 'Pune', type: 'admin'});
    save();
  }
}

/* Session */
const me = () => db.users.find(u => u.id == localStorage.getItem('sc_user'));
let flashMsg = null;
const flash = (t, c = 'ok') => { flashMsg = {t, c}; };

/* ================= SMALL HELPERS ================= */
const badge = s => `<span class="bd ${{Pending:'or',Rejected:'rd',Expired:'rd',Requested:'bl',Accepted:'bl',Collected:'or'}[s] || ''}">${esc(s)}</span>`;
const dstat = d => expired(d) && d.status === 'Available' ? 'Expired' : d.status;
const timeline = s => {
  const i = STEPS.indexOf(s);
  return `<div class="tl">${STEPS.map((x, k) => `<div class="${k <= i ? 'dn' : ''}">${x}</div>`).join('')}</div>`;
};
const catOpts = (sel = '') => Object.keys(CATS).map(c => `<option ${c === sel ? 'selected' : ''}>${c}</option>`).join('');
const userOf = id => db.users.find(u => u.id == id) || {name: 'Deleted user'};
const donOf = id => db.donations.find(d => d.id == id);
const dest = {donor: 'dash', ngo: 'dash', beneficiary: 'dash', admin: 'admin'};

function card(d) {
  const ex = expired(d), can = !ex && d.status === 'Available';
  return `<div class="card dc">${d.image ? `<img src="${d.image}" alt="">` : `<div class="ph">${CATS[d.category] || '🎁'}</div>`}
  ${badge(dstat(d))} <span class="bd bl">${esc(d.category)}</span>
  <h3>${esc(d.item)}</h3><p class="mu sm">${esc(d.desc)}</p>
  <p class="sm">📦 Qty: ${d.qty} | ✨ ${esc(d.cond)}<br>📍 ${esc(d.location)}, ${esc(d.city)}<br>⏳ ${d.until ? (ex ? 'Expired on ' : 'Available until ') + esc(d.until) : 'No expiry'}</p>
  <div style="margin-top:10px">${can ? `<button class="btn s" onclick="openReq(${d.id})">Request Donation</button>` : `<span class="mu sm">${ex ? 'Expired, requests closed' : 'Not available'}</span>`}</div></div>`;
}

/* ================= PAGES ================= */
const P = {};

P.home = () => {
  const rec = db.donations.filter(d => d.status === 'Available' && !expired(d)).slice(-3).reverse();
  return `<section class="hero"><div class="c hi"><div>
  <span class="tag">💚 Community Donation Portal</span>
  <h1>Share What You Have. Care for Someone in Need.</h1>
  <p class="mu">Share &amp; Care connects donors, NGOs and beneficiaries so clothes, books, food and stationery reach the people who need them most.</p>
  <div class="hb"><a class="btn" href="#/donate">Donate Now</a><a class="btn o" href="#/find">Find Donations</a></div></div>
  <div class="hv"><div class="blob"></div>
  <div class="fc" style="top:8%;left:5%">👕 Clothes</div><div class="fc" style="top:25%;right:0;animation-delay:1s">📚 Books</div>
  <div class="fc" style="bottom:20%;left:0;animation-delay:2s">🍲 Food</div><div class="fc" style="bottom:5%;right:12%;animation-delay:3s">✏️ Stationery</div></div></div></section>
  <section class="sec"><div class="c"><h2 class="st">Why Share &amp; Care?</h2><div class="gr g3">
  <div class="card ct"><div class="ic">🔍</div><h3>Know Where to Give</h3><p class="mu">See what is needed nearby instead of guessing.</p></div>
  <div class="card ct"><div class="ic">📦</div><h3>Easy for NGOs</h3><p class="mu">NGOs list needs and request items in one place.</p></div>
  <div class="card ct"><div class="ic">📍</div><h3>Track Every Step</h3><p class="mu">Follow a donation from Available to Delivered.</p></div></div></div></section>
  <section class="sec alt"><div class="c"><h2 class="st">How It Works</h2><div class="gr g3">
  <div class="card ct"><div class="no">1</div><h3>Donate</h3><p class="mu">Donors list items they no longer need.</p></div>
  <div class="card ct"><div class="no">2</div><h3>Connect</h3><p class="mu">NGOs and beneficiaries find and request items.</p></div>
  <div class="card ct"><div class="no">3</div><h3>Share &amp; Care</h3><p class="mu">The item is collected and delivered with care.</p></div></div></div></section>
  <section class="sec"><div class="c"><h2 class="st">Donation Categories</h2><div class="gr g6">
  ${Object.entries(CATS).map(([k, v]) => `<a class="cat" href="#/find/${encodeURIComponent(k)}">${v}<span>${k}</span></a>`).join('')}</div></div></section>
  <section class="sec alt"><div class="c"><h2 class="st">Recent Donations</h2>
  ${rec.length ? `<div class="gr g3">${rec.map(card).join('')}</div>` : '<p class="ct mu">No donations yet. Be the first to share something!</p>'}</div></section>
  <section class="cta"><div class="c ct"><h2>Ready to make a difference?</h2><p style="margin:8px 0 20px">Join our community today. It takes less than a minute.</p><a class="btn l" href="#/register">Join Share &amp; Care</a></div></section>`;
};

P.about = () => `<div class="pg c"><h1>About Share &amp; Care</h1><p class="mu" style="margin-bottom:24px">A community donation portal made for our SE Computer Engineering Community Engagement Project.</p>
<div class="gr g2"><div class="card"><h3>What is Share &amp; Care?</h3><p class="mu">A web platform that connects donors, NGOs and beneficiaries so useful items reach people in need.</p></div>
<div class="card"><h3>Why was it created?</h3><p class="mu">Many people own clothes, books, food and stationery they no longer need, while others lack them.</p></div>
<div class="card"><h3>The community problem</h3><p class="mu">Donors do not know where to donate or what is required, and NGOs struggle to collect and manage donations.</p></div>
<div class="card"><h3>How the portal helps</h3><p class="mu">It makes donating simple, organized and transparent with search, requests and live status tracking.</p></div>
<div class="card"><h3>💚 Benefits for donors</h3><p class="mu">Easy listing, clear requests and proof the item reached someone.</p></div>
<div class="card"><h3>🏢 Benefits for NGOs</h3><p class="mu">Publish required items and request donations in one place.</p></div>
<div class="card"><h3>🙋 Benefits for beneficiaries</h3><p class="mu">Find nearby help quickly and track your requests.</p></div></div></div>`;

P.how = () => `<div class="pg c ct"><h1>How It Works</h1><p class="mu" style="margin-bottom:24px">Three simple steps</p><div class="gr g3">
<div class="card"><div class="no">1</div><h3>DONATE</h3><p class="mu">Register as a donor and list items with photo, quantity, location and expiry.</p></div>
<div class="card"><div class="no">2</div><h3>CONNECT</h3><p class="mu">NGOs and beneficiaries search by category or city and send a request. The donor accepts or rejects.</p></div>
<div class="card"><div class="no">3</div><h3>SHARE &amp; CARE</h3><p class="mu">The item is collected and delivered. Everyone can track the status.</p></div></div>
<p style="margin-top:28px"><a class="btn" href="#/register">Get Started</a></p></div>`;

P.contact = () => `<div class="pg c"><div class="fm"><h1>Contact Us</h1><form onsubmit="return sendContact(event)" novalidate>
<label>Name</label><input name="name"><label>Email</label><input name="email" type="email"><label>Subject</label><input name="subject">
<label>Message</label><textarea name="message" rows="5"></textarea><br><br><button class="btn">Submit</button></form></div></div>`;

P.register = () => `<div class="pg c"><div class="fm card"><h1>Create Account</h1><form onsubmit="return doRegister(event)" novalidate>
<label>I am a</label><select name="type"><option value="donor">Donor</option><option value="ngo">NGO</option><option value="beneficiary">Beneficiary</option></select>
<label>Full Name (or NGO name)</label><input name="name"><div class="row"><div><label>Email</label><input name="email" type="email"></div><div><label>Mobile Number</label><input name="mobile"></div></div>
<div class="row"><div><label>Password</label><input name="pw" type="password"></div><div><label>Confirm Password</label><input name="pw2" type="password"></div></div>
<label>Address</label><input name="address"><label>City</label><input name="city"><br><br><button class="btn">Register</button>
<p class="sm mu" style="margin-top:10px">Already registered? <a href="#/login" style="color:var(--g)">Login</a></p></form></div></div>`;

P.login = () => `<div class="pg c"><div class="fm card"><h1>Login</h1><form onsubmit="return doLogin(event)" novalidate>
<label>User Type</label><select name="type"><option value="donor">Donor</option><option value="ngo">NGO</option><option value="beneficiary">Beneficiary</option><option value="admin">Admin</option></select>
<label>Email</label><input name="email" type="email"><label>Password</label><input name="pw" type="password"><br><br><button class="btn">Login</button>
<p class="sm mu" style="margin-top:10px">New here? <a href="#/register" style="color:var(--g)">Register</a><br>Demo admin: admin@shareandcare.com / admin123</p></form></div></div>`;

P.find = (arg) => {
  const f = window.filt || {q: '', cat: arg ? decodeURIComponent(arg) : '', city: ''};
  if (arg && !window.filt) f.cat = decodeURIComponent(arg);
  const list = db.donations.filter(d => d.status === 'Available' && !expired(d) &&
    (!f.cat || d.category === f.cat) &&
    (!f.city || (d.city + ' ' + d.location).toLowerCase().includes(f.city.toLowerCase())) &&
    (!f.q || (d.item + ' ' + d.desc).toLowerCase().includes(f.q.toLowerCase())));
  window.filt = null;
  return `<div class="pg c"><h1>Find Donations</h1><p class="mu" style="margin-bottom:18px">Only available, non expired donations are shown.</p>
  <form class="fb" onsubmit="return doSearch(event)"><input name="q" placeholder="Search items..." value="${esc(f.q)}">
  <select name="cat"><option value="">All categories</option>${catOpts(f.cat)}</select><input name="city" placeholder="City or area" value="${esc(f.city)}"><button class="btn">Search</button></form>
  ${list.length ? `<div class="gr g3">${list.map(card).join('')}</div>` : '<p class="ct mu">No donations found.</p>'}</div>`;
};

P.donate = () => `<div class="pg c"><div class="fm card"><h1>Add Donation</h1><form onsubmit="return addDonation(event)" novalidate>
<label>Item Name</label><input name="item"><div class="row"><div><label>Category</label><select name="category">${catOpts()}</select></div><div><label>Quantity</label><input name="qty" type="number" min="1" value="1"></div></div>
<label>Description</label><textarea name="desc" rows="3"></textarea><div class="row"><div><label>Condition</label><select name="cond"><option>New</option><option>Good</option><option>Fair</option></select></div>
<div><label>Available Until / Expiry (required for Food)</label><input name="until" type="date" min="${today()}"></div></div>
<div class="row"><div><label>Location / Area</label><input name="location"></div><div><label>City</label><input name="city" value="${esc(me()?.city)}"></div></div>
<label>Image (JPG/PNG, max 300 KB)</label><input name="image" type="file" accept="image/png,image/jpeg"><br><br><button class="btn">Submit Donation</button></form></div></div>`;

P.profile = () => { const u = me(); return `<div class="pg c"><div class="fm card"><h1>Profile</h1><p class="mu">${esc(u.type.toUpperCase())} | ${esc(u.email)}</p>
<form onsubmit="return saveProfile(event)" novalidate><label>Full Name</label><input name="name" value="${esc(u.name)}"><label>Mobile</label><input name="mobile" value="${esc(u.mobile)}">
<label>Address</label><input name="address" value="${esc(u.address)}"><label>City</label><input name="city" value="${esc(u.city)}"><br><br><button class="btn">Update Profile</button></form></div></div>`; };

P.dash = () => {
  const u = me();
  if (u.type === 'donor') {
    const my = db.donations.filter(d => d.donor_id == u.id);
    const rq = db.requests.filter(r => my.some(d => d.id == r.donation_id));
    const stat = [['Total Donations', my.length], ['Active Donations', my.filter(d => d.status !== 'Delivered' && !expired(d)).length],
      ['Pending Requests', rq.filter(r => r.status === 'Pending').length], ['Completed', my.filter(d => d.status === 'Delivered').length]];
    return `<div class="pg c"><h1>Donor Dashboard</h1><p class="mu">Welcome, ${esc(u.name)}</p>${statRow(stat)}
    <div class="hb" style="margin-bottom:10px"><a class="btn" href="#/donate">+ Add Donation</a><a class="btn o" href="#/profile">Profile</a><a class="btn o" onclick="logout()" href="#/">Logout</a></div>
    <h3 class="sh">Donation Requests</h3>${rq.length ? rq.slice().reverse().map(r => { const d = donOf(r.donation_id), p = userOf(r.requester_id); return `<div class="box"><b>${esc(p.name)}</b> (${esc(p.type)}) requests <b>${esc(d.item)}</b> ${badge(r.status)}
      <p class="sm">Quantity: ${r.qty} | Date: ${esc(r.date)}<br>Reason: ${esc(r.reason)}<br>Message: ${esc(r.message) || '-'}<br>Contact: ${esc(r.contact)}</p>
      ${r.status === 'Pending' ? `<div class="ac"><button class="btn s" onclick="decide(${r.id},'Accepted')">Accept</button><button class="btn s r" onclick="decide(${r.id},'Rejected')">Reject</button></div>` : ''}</div>`; }).join('') : '<p class="mu">No requests yet.</p>'}
    <h3 class="sh">My Donations</h3>${my.filter(d => d.status !== 'Delivered').length ? my.filter(d => d.status !== 'Delivered').map(myDon).join('') : '<p class="mu">Nothing active.</p>'}
    <h3 class="sh">Donation History</h3>${my.filter(d => d.status === 'Delivered').map(myDon).join('') || '<p class="mu">No completed donations yet.</p>'}</div>`;
  }
  const mine = db.requests.filter(r => r.requester_id == u.id);
  const stat = [['Total Requests', mine.length], ['Pending', mine.filter(r => r.status === 'Pending').length],
    ['Accepted', mine.filter(r => r.status === 'Accepted').length], ['Received', mine.filter(r => donOf(r.donation_id)?.status === 'Delivered').length]];
  const row = r => { const d = donOf(r.donation_id) || {item: 'Removed', status: 'Available'}; return `<div class="box"><b>${esc(d.item)}</b> ${badge(r.status)}
    <p class="sm mu">Qty ${r.qty} | ${esc(r.date)} | Donor: ${esc(userOf(d.donor_id).name)}</p>${r.status === 'Rejected' ? '' : timeline(d.status)}</div>`; };
  const needs = db.needs.filter(n => n.ngo_id == u.id);
  return `<div class="pg c"><h1>${u.type === 'ngo' ? 'NGO' : 'Beneficiary'} Dashboard</h1><p class="mu">Welcome, ${esc(u.name)}</p>${statRow(stat)}
  <div class="hb" style="margin-bottom:10px"><a class="btn" href="#/find">Search Donations</a><a class="btn o" href="#/profile">${u.type === 'ngo' ? 'NGO ' : ''}Profile</a><a class="btn o" onclick="logout()" href="#/">Logout</a></div>
  ${u.type === 'ngo' ? `<h3 class="sh">Required Items</h3><form class="fb" onsubmit="return addNeed(event)" novalidate><input name="item" placeholder="Item needed"><select name="category">${catOpts()}</select><input name="qty" type="number" min="1" placeholder="Qty"><button class="btn s">Add</button></form>
  ${needs.map(n => `<div class="box">${CATS[n.category]} <b>${esc(n.item)}</b> x ${n.qty} <button class="btn s r" style="float:right" onclick="delNeed(${n.id})">Remove</button></div>`).join('') || '<p class="mu">No requirements listed yet.</p>'}` : ''}
  <h3 class="sh">My Requests and Status</h3>${mine.filter(r => donOf(r.donation_id)?.status !== 'Delivered').reverse().map(row).join('') || '<p class="mu">No active requests.</p>'}
  <h3 class="sh">Donation History</h3>${mine.filter(r => donOf(r.donation_id)?.status === 'Delivered').map(row).join('') || '<p class="mu">Nothing received yet.</p>'}</div>`;
};
const statRow = s => `<div class="gr g4 st4" style="margin:20px 0">${s.map(x => `<div class="card"><div class="n">${x[1]}</div><div class="mu sm">${x[0]}</div></div>`).join('')}</div>`;
const myDon = d => `<div class="box"><b>${esc(d.item)}</b> ${badge(dstat(d))} <span class="mu sm">Qty ${d.qty} | ${esc(d.city)}</span>${timeline(d.status)}
  <div class="ac">${d.status === 'Accepted' ? `<button class="btn s" onclick="setStatus(${d.id},'Collected')">Mark Collected</button>` : ''}
  ${d.status === 'Collected' ? `<button class="btn s" onclick="setStatus(${d.id},'Delivered')">Mark Delivered</button>` : ''}
  ${d.status === 'Available' ? `<button class="btn s r" onclick="delDon(${d.id})">Delete</button>` : ''}</div></div>`;

let ufilt = 'all';
P.admin = () => {
  const users = db.users.filter(u => ufilt === 'all' || u.type === ufilt);
  const stat = [['Total Users', db.users.length], ['Total Donations', db.donations.length],
    ['Active Donations', db.donations.filter(d => d.status !== 'Delivered' && !expired(d)).length],
    ['Total Requests', db.requests.length], ['Completed Donations', db.donations.filter(d => d.status === 'Delivered').length]];
  return `<div class="pg c"><h1>Admin Panel</h1>${statRow(stat)}<a class="btn o s" onclick="logout()" href="#/">Logout</a>
  <h3 class="sh">Users</h3><div class="fb">${['all', 'donor', 'ngo', 'beneficiary'].map(t => `<button class="btn s ${ufilt === t ? '' : 'o'}" onclick="ufilt='${t}';route()">${t === 'all' ? 'All' : t.toUpperCase()}</button>`).join('')}</div>
  <div class="ov"><table><tr><th>Name</th><th>Email</th><th>Type</th><th>City</th><th></th></tr>${users.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${badge(u.type)}</td><td>${esc(u.city)}</td><td>${u.type === 'admin' ? '' : `<button class="btn s r" onclick="delUser(${u.id})">Delete</button>`}</td></tr>`).join('')}</table></div>
  <h3 class="sh">All Donations</h3><div class="ov"><table><tr><th>Item</th><th>Category</th><th>Donor</th><th>City</th><th>Status</th><th></th></tr>${db.donations.map(d => `<tr><td>${esc(d.item)}</td><td>${esc(d.category)}</td><td>${esc(userOf(d.donor_id).name)}</td><td>${esc(d.city)}</td><td>${badge(dstat(d))}</td><td><button class="btn s r" onclick="adminDelDon(${d.id})">Delete</button></td></tr>`).join('') || '<tr><td colspan="6">None</td></tr>'}</table></div>
  <h3 class="sh">All Requests</h3><div class="ov"><table><tr><th>Requester</th><th>Item</th><th>Qty</th><th>Date</th><th>Status</th></tr>${db.requests.map(r => `<tr><td>${esc(userOf(r.requester_id).name)}</td><td>${esc(donOf(r.donation_id)?.item)}</td><td>${r.qty}</td><td>${esc(r.date)}</td><td>${badge(r.status)}</td></tr>`).join('') || '<tr><td colspan="5">None</td></tr>'}</table></div></div>`;
};

/* ================= ACTIONS ================= */
const fd = e => Object.fromEntries(new FormData(e.target));
const go = h => { location.hash = h; };
const mailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

async function doRegister(e) {
  e.preventDefault(); const f = fd(e);
  if (!f.name.trim() || !f.email.trim() || !f.mobile.trim() || !f.pw || !f.address.trim() || !f.city.trim()) return fail('All fields are required.');
  if (!mailOk(f.email)) return fail('Enter a valid email address.');
  if (!/^\d{10}$/.test(f.mobile)) return fail('Mobile number must be 10 digits.');
  if (f.pw.length < 6) return fail('Password must be at least 6 characters.');
  if (f.pw !== f.pw2) return fail('Passwords do not match.');
  const email = f.email.trim().toLowerCase();
  if (db.users.some(u => u.email === email)) return fail('This email is already registered.');
  db.users.push({id: nid(db.users), name: f.name.trim(), email, mobile: f.mobile, pw: await hash(f.pw, email), address: f.address.trim(), city: f.city.trim(), type: f.type});
  save(); flash('Registration successful. Please login.'); go('#/login'); return false;
}
async function doLogin(e) {
  e.preventDefault(); const f = fd(e), email = f.email.trim().toLowerCase();
  const u = db.users.find(x => x.email === email && x.type === f.type);
  if (!u || u.pw !== await hash(f.pw, email)) return fail('Invalid email, password or user type.');
  localStorage.setItem('sc_user', u.id); flash('Welcome back, ' + u.name + '!'); go('#/' + dest[u.type]); return false;
}
function logout() { localStorage.removeItem('sc_user'); flash('You have been logged out.'); }
function fail(m) { document.getElementById('flash').innerHTML = `<div class="fl err">${esc(m)}</div>`; window.scrollTo(0, 0); return false; }

function doSearch(e) { e.preventDefault(); window.filt = fd(e); route(); return false; }

function addDonation(e) {
  e.preventDefault(); const f = fd(e), file = e.target.image.files[0];
  if (!f.item.trim() || !f.desc.trim() || !f.location.trim() || !f.city.trim() || !(+f.qty > 0)) return fail('Fill all required fields.');
  if (f.category === 'Food' && !f.until) return fail('Food donations need an expiry date.');
  if (f.until && f.until < today()) return fail('Expiry date cannot be in the past.');
  const finish = img => {
    db.donations.push({id: nid(db.donations), donor_id: me().id, item: f.item.trim(), category: f.category, desc: f.desc.trim(), qty: +f.qty, cond: f.cond,
      location: f.location.trim(), city: f.city.trim(), until: f.until, image: img, status: 'Available', date: today()});
    save(); flash('Donation added successfully! It is now visible in Find Donations.'); go('#/dash');
  };
  if (!file) { finish(''); return false; }
  if (!['image/jpeg', 'image/png'].includes(file.type)) return fail('Only JPG or PNG images are allowed.');
  if (file.size > 300 * 1024) return fail('Image must be under 300 KB.');
  const rd = new FileReader(); rd.onload = () => finish(rd.result); rd.readAsDataURL(file); return false;
}

function openReq(id) {
  const u = me(), d = donOf(id);
  if (!u) { flash('Please login to request a donation.', 'err'); return go('#/login'); }
  if (u.type === 'donor' || u.type === 'admin') return fail('Only NGOs and beneficiaries can request donations.');
  if (expired(d)) return fail('This donation has expired.');
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="card"><h2>Request: ${esc(d.item)}</h2><form onsubmit="return sendReq(event,${id})" novalidate>
  <label>Requested quantity (max ${d.qty})</label><input name="qty" type="number" min="1" max="${d.qty}" value="1"><label>Reason for request</label><input name="reason">
  <label>Message to donor</label><textarea name="message" rows="3"></textarea><label>Contact information</label><input name="contact" value="${esc(u.mobile)}"><br><br>
  <button class="btn">Send Request</button> <button type="button" class="btn o" onclick="closeM()">Cancel</button></form></div>`;
  m.classList.add('on');
}
const closeM = () => document.getElementById('modal').classList.remove('on');
function sendReq(e, id) {
  e.preventDefault(); const f = fd(e), d = donOf(id);
  if (!f.reason.trim() || !f.contact.trim() || !(+f.qty > 0) || +f.qty > d.qty) return fail('Enter a valid quantity, reason and contact.');
  if (expired(d) || d.status !== 'Available') { closeM(); return fail('This donation is no longer available.'); }
  db.requests.push({id: nid(db.requests), donation_id: id, requester_id: me().id, qty: +f.qty, reason: f.reason.trim(), message: f.message.trim(), contact: f.contact.trim(), status: 'Pending', date: today()});
  d.status = 'Requested'; save(); closeM(); flash('Request sent. Track it from your dashboard.'); go('#/dash'); return false;
}
function decide(rid, status) {
  const r = db.requests.find(x => x.id == rid), d = donOf(r.donation_id); r.status = status;
  if (status === 'Accepted') { d.status = 'Accepted'; db.requests.forEach(o => { if (o.donation_id == d.id && o.status === 'Pending') o.status = 'Rejected'; }); }
  else if (!db.requests.some(o => o.donation_id == d.id && o.status === 'Pending') && d.status === 'Requested') d.status = 'Available';
  save(); flash('Request ' + status.toLowerCase() + '.'); route();
}
function setStatus(id, s) { donOf(id).status = s; save(); flash('Status updated to ' + s + '.'); route(); }
function delDon(id) { if (confirm('Delete this donation?')) { db.donations = db.donations.filter(d => d.id != id); db.requests = db.requests.filter(r => r.donation_id != id); save(); route(); } }
function adminDelDon(id) { delDon(id); }
function delUser(id) {
  if (!confirm('Delete this user and all their data?')) return;
  const ids = db.donations.filter(d => d.donor_id == id).map(d => d.id);
  db.donations = db.donations.filter(d => d.donor_id != id);
  db.requests = db.requests.filter(r => r.requester_id != id && !ids.includes(r.donation_id));
  db.needs = db.needs.filter(n => n.ngo_id != id); db.users = db.users.filter(u => u.id != id); save(); route();
}
function addNeed(e) {
  e.preventDefault(); const f = fd(e);
  if (!f.item.trim() || !(+f.qty > 0)) return fail('Enter item name and quantity.');
  db.needs.push({id: nid(db.needs), ngo_id: me().id, item: f.item.trim(), category: f.category, qty: +f.qty}); save(); route(); return false;
}
function delNeed(id) { db.needs = db.needs.filter(n => n.id != id); save(); route(); }
function saveProfile(e) {
  e.preventDefault(); const f = fd(e), u = me();
  if (!f.name.trim() || !/^\d{10}$/.test(f.mobile) || !f.city.trim()) return fail('Name, 10 digit mobile and city are required.');
  Object.assign(u, {name: f.name.trim(), mobile: f.mobile, address: f.address.trim(), city: f.city.trim()}); save(); flash('Profile updated.'); route(); return false;
}
function sendContact(e) {
  e.preventDefault(); const f = fd(e);
  if (!f.name.trim() || !f.subject.trim() || !f.message.trim()) return fail('All fields are required.');
  if (!mailOk(f.email)) return fail('Enter a valid email address.');
  db.msgs.push({...f, date: today()}); save(); flash('Thank you! Your message has been received.'); e.target.reset(); route(); return false;
}

/* ================= ROUTER & NAV ================= */
const ROLE = {donate: ['donor'], dash: ['donor', 'ngo', 'beneficiary'], admin: ['admin'], profile: ['donor', 'ngo', 'beneficiary', 'admin']};
function route() {
  const [, page = '', arg] = location.hash.split('/'), name = page || 'home', u = me();
  let view = P[name] ? name : 'home';
  if (ROLE[view]) {
    if (!u) { flash('Please login first.', 'err'); view = 'login'; }
    else if (!ROLE[view].includes(u.type)) { flash('You are not authorized to open that page.', 'err'); view = dest[u.type] || 'home'; }
  }
  document.getElementById('app').innerHTML = P[view](arg);
  document.getElementById('flash').innerHTML = flashMsg ? `<div class="fl ${flashMsg.c}">${esc(flashMsg.t)}</div>` : ''; flashMsg = null;
  document.getElementById('nav').classList.remove('on');
  document.getElementById('nav').innerHTML = `<a href="#/">Home</a><a href="#/about">About</a><a href="#/donate">Donate</a><a href="#/find">Find Donations</a><a href="#/how">How It Works</a><a href="#/contact">Contact</a>` +
    (u ? `<a href="#/${dest[u.type]}" class="btn o s">${u.type === 'admin' ? 'Admin' : 'Dashboard'}</a><a href="#/" onclick="logout()" class="btn s">Logout</a>` :
      `<a href="#/login" class="btn o s">Login</a><a href="#/register" class="btn s">Register</a>`);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
initDb().then(route);
</script>
</body>
</html>
